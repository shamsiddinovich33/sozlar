# Packages allowed to run install scripts (Prisma engines, esbuild, the ESLint resolver).
# `allowBuilds` replaces the older `onlyBuiltDependencies` setting (pnpm 10.28+, 11, 12).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true

# Only install package versions that have been public for at least a day
# (matches pnpm 11+'s default supply-chain policy).
minimumReleaseAge: 1440
